name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout localization branch
        uses: actions/checkout@v7
        with:
          ref: l10n-2-localized-release

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@22.13.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format localization files and push
        run: |
          pnpm exec prettier --write src/components/LanguageSwitcher.astro src/content/locales/de.ts src/content/locales/es.ts src/content/locales/fr.ts src/content/locales/pt-br.ts src/content/locales/ru.ts 'src/pages/[...localized].astro'
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/LanguageSwitcher.astro src/content/locales/de.ts src/content/locales/es.ts src/content/locales/fr.ts src/content/locales/pt-br.ts src/content/locales/ru.ts 'src/pages/[...localized].astro'
          git commit -m "style: format localization files"
          git push origin HEAD:l10n-2-localized-release
