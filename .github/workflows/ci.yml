name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@22.13.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply CL-046 follow-up
        if: github.event_name == 'pull_request' && github.head_ref == 'task/cl-046-final-hardening'
        run: |
          python - <<'PY'
          from pathlib import Path

          compare = Path("src/scripts/compare-tool.ts")
          text = compare.read_text()
          old = '''    if (
              hooks.copyResult.disabled ||
              state.inputTimer !== null ||
              (state.listA === "" && state.listB === "")
            ) {'''
          new = '''    if (
              state.inputTimer !== null ||
              (state.listA === "" && state.listB === "")
            ) {'''
          if old not in text:
              raise SystemExit("Compare Copy guard pattern not found")
          compare.write_text(text.replace(old, new, 1))

          layout = Path("src/layouts/BaseLayout.astro")
          text = layout.read_text()
          old = '<script type="application/ld+json" set:html={websiteStructuredData} />'
          new = '<script is:inline type="application/ld+json" set:html={websiteStructuredData} />'
          if old not in text:
              raise SystemExit("JSON-LD script pattern not found")
          layout.write_text(text.replace(old, new, 1))
          PY
          pnpm format
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scripts/compare-tool.ts src/layouts/BaseLayout.astro
          git commit -m "CL-046 preserve empty-result Copy contract"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E smoke
        run: pnpm test:e2e
