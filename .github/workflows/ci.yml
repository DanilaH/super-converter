name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse-production-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check live compression, caching and TLS certificate
        run: |
          echo '=== RESPONSE HEADERS ==='
          curl -sS --compressed -D - -o /dev/null https://listcontrast.com/ | sed -n '1,30p'
          echo '=== CERTIFICATE ==='
          echo | openssl s_client -connect listcontrast.com:443 -servername listcontrast.com 2>/dev/null | openssl x509 -noout -subject -issuer -dates

      - name: Run Lighthouse on representative production pages
        run: |
          set -euo pipefail
          mkdir -p /tmp/lighthouse
          for entry in \
            'home https://listcontrast.com/' \
            'team https://listcontrast.com/random-team-generator' \
            'lines https://listcontrast.com/remove-line-breaks'; do
            name="${entry%% *}"
            url="${entry#* }"
            npx -y lighthouse "$url" \
              --quiet \
              --chrome-flags='--headless=new --no-sandbox' \
              --output=json \
              --output-path="/tmp/lighthouse/${name}-mobile.json" \
              --only-categories=performance,accessibility,best-practices,seo
            npx -y lighthouse "$url" \
              --quiet \
              --chrome-flags='--headless=new --no-sandbox' \
              --preset=desktop \
              --output=json \
              --output-path="/tmp/lighthouse/${name}-desktop.json" \
              --only-categories=performance,accessibility,best-practices,seo
          done

          node <<'NODE'
          const fs = require('node:fs');
          for (const file of fs.readdirSync('/tmp/lighthouse').sort()) {
            const report = JSON.parse(fs.readFileSync(`/tmp/lighthouse/${file}`, 'utf8'));
            const c = report.categories;
            const a = report.audits;
            const result = {
              file,
              scores: {
                performance: Math.round(c.performance.score * 100),
                accessibility: Math.round(c.accessibility.score * 100),
                bestPractices: Math.round(c['best-practices'].score * 100),
                seo: Math.round(c.seo.score * 100),
              },
              metrics: {
                fcpMs: Math.round(a['first-contentful-paint'].numericValue),
                lcpMs: Math.round(a['largest-contentful-paint'].numericValue),
                tbtMs: Math.round(a['total-blocking-time'].numericValue),
                cls: Number(a['cumulative-layout-shift'].numericValue.toFixed(3)),
                speedIndexMs: Math.round(a['speed-index'].numericValue),
              },
            };
            console.log('PROD_LIGHTHOUSE', JSON.stringify(result));
          }
          NODE
